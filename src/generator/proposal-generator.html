<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP Proposal Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --msp-cyan:#00ABED; --msp-cyan2:#1CABEE; --msp-navy:#004970; --msp-dark:#0B3652;
  --msp-pink:#F05380; --ink:#1A1517; --muted:#BFBFBF; --line:#E8E8E8;
  --bg:#F2F5F7; --panel:#FFFFFF;
  --glass:rgba(255,255,255,.78); --glass-strong:rgba(255,255,255,.94);
  --control:#DCE5EA; --control-hover:#F5FAFD; --subtle:#8A97A0;
}
:root:not([data-theme="light"]){ }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:'Inter',Arial,sans-serif;color:var(--ink)}

/* ============ APP CHROME ============ */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{position:relative;z-index:20;display:flex;align-items:center;gap:12px;margin:10px 12px 0;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);border-radius:12px;padding:10px 12px;box-shadow:0 8px 28px rgba(11,54,82,.09);backdrop-filter:blur(22px) saturate(140%);flex-wrap:nowrap}
#topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--msp-navy);font-size:14px;white-space:nowrap}
#topbar .brand svg{width:22px;height:22px}
.seg{display:flex;border:1px solid #DCE5EA;border-radius:10px;overflow:hidden;background:rgba(233,239,243,.72);padding:3px;flex-shrink:0}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 12px;font:600 12px 'Inter';cursor:pointer;color:#62717B;transition:background .16s,color .16s,box-shadow .16s}
.seg button.on{background:#fff;color:var(--msp-navy);box-shadow:0 1px 4px rgba(11,54,82,.13)}
select,#topbar input{border:1px solid #DCE5EA;border-radius:8px;padding:8px 10px;font:500 12px 'Inter';background:rgba(255,255,255,.9);color:var(--msp-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;border:0;border-radius:8px;padding:8px 12px;font:700 12px 'Inter';cursor:pointer;white-space:nowrap;transition:background .16s,color .16s,border-color .16s,box-shadow .16s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.seg button:focus-visible,select:focus-visible,.menu>summary:focus-visible{outline:2px solid var(--msp-cyan);outline-offset:2px}
.btn svg{width:16px;height:16px;stroke-width:2;flex:none}
.btn.primary{background:var(--msp-navy);color:#fff;box-shadow:0 2px 7px rgba(0,73,112,.2)}
.btn.primary:hover{background:var(--msp-dark)}
.btn.ghost{background:transparent;color:var(--msp-navy)}
.btn.ghost:hover{background:#EAF6FD}
.btn.soft{background:#EAF6FD;color:var(--msp-navy)}
.btn.icon{width:34px;padding:0}
#topbar .right{margin-left:auto;display:flex;gap:7px;align-items:center;min-width:0}
#topbar .divider{width:1px;height:22px;background:var(--line)}
.proposal-context{display:flex;align-items:center;gap:8px;min-width:190px;max-width:330px;flex:1}
.proposal-context select{min-width:0;width:100%;height:34px;box-shadow:0 1px 3px rgba(11,54,82,.05)}
.savestate{display:inline-flex;align-items:center;gap:5px;font:600 10.5px 'Inter';color:#8A97A0;white-space:nowrap}
.savestate:not(:empty)::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent)}
.savestate.ok{color:#2E8B57}
.toolcluster{display:flex;align-items:center;gap:2px;background:rgba(243,247,249,.82);border:1px solid #E6ECEF;border-radius:10px;padding:3px}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu[open]>summary{background:#EAF6FD}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);width:220px;background:rgba(255,255,255,.96);border:1px solid rgba(220,229,234,.9);border-radius:10px;padding:6px;box-shadow:0 14px 35px rgba(11,54,82,.18);backdrop-filter:blur(18px);animation:menuIn .14s ease-out}
.menu-pop button{width:100%;justify-content:flex-start;background:transparent;color:var(--msp-dark);font-weight:600}
.menu-pop button:hover{background:#F3F7F9}
.menu-pop .danger{color:#B23C5E}
.menu-label{padding:6px 9px 4px;font:700 9.5px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:#8A97A0}
.export-group{display:flex;align-items:center;gap:6px}
.chev{width:12px!important;height:12px!important}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.btn,.seg button,.menu-pop{transition:none;animation:none}}
@media(max-width:1120px){#topbar{gap:8px}.brand-name{display:none}.proposal-context{min-width:160px}.btn .label-optional{display:none}.btn{padding:8px 10px}}
@media(max-width:820px){#topbar{overflow-x:auto;margin:8px 8px 0}.proposal-context{min-width:150px}.savestate{display:none}}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:300px;min-width:300px;margin:10px 0 10px 12px;background:var(--glass);border:1px solid rgba(255,255,255,.92);border-radius:12px;box-shadow:0 8px 28px rgba(11,54,82,.08);backdrop-filter:blur(22px) saturate(140%);overflow-y:auto;padding:14px 12px;scrollbar-width:thin;scrollbar-color:var(--control) transparent}
#sidebar::-webkit-scrollbar{width:8px}
#sidebar::-webkit-scrollbar-thumb{background:var(--control);border:2px solid transparent;border-radius:8px;background-clip:padding-box}
#sidebar h3{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--subtle);margin:18px 2px 9px}
#sidebar h3::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--control),transparent)}
#sidebar h3:first-child{margin-top:2px}
.fld{margin-bottom:9px}
.fld label{display:block;font:600 11.5px 'Inter';color:#5A6B76;margin:0 2px 4px}
.fld input{width:100%;border:1px solid var(--control);border-radius:8px;padding:8px 9px;font:500 12.5px 'Inter';color:var(--msp-dark);background:var(--glass-strong);box-shadow:0 1px 2px rgba(11,54,82,.03);transition:border-color .16s,box-shadow .16s,background .16s}
.fld input:hover{border-color:#C5D5DE;background:#fff}
.fld input:focus{outline:none;border-color:var(--msp-cyan);box-shadow:0 0 0 3px rgba(0,171,237,.12);background:#fff}
.chk{display:flex;align-items:center;gap:9px;min-height:32px;padding:6px 7px;font:500 12.5px 'Inter';cursor:pointer;border-radius:8px;transition:background .14s,color .14s}
.chk:hover{background:var(--control-hover)}
.chk input,.rowchk input,.qrow .qname input,.cat-head input{width:15px;height:15px;accent-color:var(--msp-cyan);flex:none;cursor:pointer}
.cat-head{min-height:30px;font:700 10.5px 'Inter';color:var(--msp-pink);letter-spacing:.06em;margin:12px 0 3px;padding:6px 7px;border-radius:8px;background:rgba(240,83,128,.06)}
.rowchk{display:flex;align-items:center;gap:8px;min-height:29px;padding:5px 7px;font:500 12px 'Inter';cursor:pointer;border-radius:8px;transition:background .14s,color .14s}
.rowchk:hover{background:var(--control-hover)}
.rowchk img{width:20px;height:13px;object-fit:contain}
.addrow{font:600 11.5px 'Inter';color:var(--msp-cyan);background:none;border:0;cursor:pointer;padding:6px 7px;border-radius:7px}
.addrow:hover{background:var(--control-hover)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:5px 7px;font:500 12px 'Inter';border-radius:8px}
.qrow:hover{background:var(--control-hover)}
.qrow .qname{display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;min-width:0}
.qrow .qname input{width:auto;accent-color:var(--msp-cyan)}
.qrow input[type="number"]:disabled{background:#F4F6F7;color:#B6C0C7}
.qrow input{width:62px;border:1px solid var(--control);border-radius:7px;padding:6px 7px;font:600 12px 'Inter';text-align:right;background:var(--glass-strong)}
.qrow input:focus{outline:none;border-color:var(--msp-cyan);box-shadow:0 0 0 3px rgba(0,171,237,.12)}
.hint{font:500 11px 'Inter';color:var(--subtle);background:rgba(245,250,253,.88);border:1px solid rgba(220,229,234,.72);border-radius:9px;padding:9px 10px;margin-top:12px;line-height:1.5}
@media(max-width:820px){#sidebar{margin:8px 0 8px 8px}}

#preview{flex:1;overflow-y:auto;padding:26px;display:flex;flex-direction:column;align-items:center;gap:26px}

/* ============ A4 PAGES ============ */
.page{width:210mm;height:297mm;background:#fff;box-shadow:0 4px 22px rgba(10,40,60,.13);position:relative;overflow:hidden;flex-shrink:0}
.page [contenteditable]:hover{outline:1.5px dashed #9BD9F5;outline-offset:2px;border-radius:2px}
.page [contenteditable]:focus{outline:1.5px solid var(--msp-cyan);outline-offset:2px;border-radius:2px}
.pad{padding:14mm 15mm 18mm}
.pfoot{position:absolute;bottom:8mm;left:15mm;right:15mm;display:flex;justify-content:space-between;font:500 7.5pt 'Inter';color:#6B7780}
.plogo{display:flex;align-items:center;gap:2.2mm;margin-bottom:7mm}
.plogo svg{width:8.5mm;height:8.5mm}
.plogo .wm{font-size:14.5pt;font-weight:800;color:var(--msp-dark);letter-spacing:-.01em}
.wm .lt{font-weight:600}

/* cover */
.cover .band{position:absolute;top:26mm;left:0;right:0;height:158mm;background:#EAF6FB;overflow:hidden}
.cover .band img.hero{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center}
.cover.partner .band{top:26mm;height:170mm;background:#fff}
.cover.partner .band img.hero{object-position:right center}
.cover.partner .title{top:38mm}
.cover.partner .meta{top:212mm}
.cover .title{position:absolute;left:15mm;top:32mm;width:78mm;color:var(--msp-dark);z-index:2}
.cover .title h1{font-size:24pt;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin-bottom:9mm}
.cover .title p{font-size:9.5pt;font-weight:500;line-height:1.5;margin-bottom:4.5mm;color:#0D2E44}
.cover .meta{position:absolute;left:15mm;right:15mm;top:206mm;display:grid;grid-template-columns:1fr 1fr;gap:5mm 12mm}
.cover .meta .lbl{font:700 8pt 'Inter';color:var(--ink);margin-bottom:1.2mm}
.cover .meta .val{font:500 9pt 'Inter';color:#2C3A44}
.cover .meta .val.big{font-size:12.5pt;font-weight:700}

/* content typographic pages */
h2.sec{font-size:16pt;font-weight:700;color:var(--ink);margin-bottom:4mm}
h2.sec.center{text-align:center}
.lead{font-size:9pt;line-height:1.55;color:#333;margin-bottom:6mm;max-width:165mm}
.cyansub{font:700 10.5pt 'Inter';color:var(--msp-cyan2);margin:6mm 0 2.5mm}
.threecol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7mm;margin-top:4mm}
.threecol h4, .twocol h4{font-size:9.5pt;font-weight:700;margin-bottom:1.6mm;color:var(--ink)}
.threecol p, .twocol p{font-size:8pt;line-height:1.5;color:#3A464F}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:6mm 10mm;margin-top:4mm}
.benefit ul{margin:1.5mm 0 0 4mm}
.benefit li{font-size:8pt;line-height:1.55;color:#3A464F;margin-bottom:1mm}
.benefit .tag{font-size:8.2pt;color:#5A6B76;font-weight:500;margin-bottom:1mm}
.hr{height:1px;background:var(--line);margin:7mm 0}

/* financieel */
.feeitem{margin-bottom:4.5mm;break-inside:avoid}
.feeitem .top{display:flex;justify-content:space-between;border-bottom:1.2px solid var(--ink);padding-bottom:1mm;font-size:8.8pt}
.feeitem .top .amt{font-weight:600}
.feeitem .desc{font-size:7.6pt;line-height:1.45;color:#4A555E;padding-top:1.2mm}
.finwrap{display:grid;grid-template-columns:1fr 1fr;gap:0 12mm}

/* pricing table */
.ptable{width:100%;border-collapse:collapse}
.ptable .thead td{font:700 7.6pt 'Inter';color:var(--msp-cyan2);padding:0.8mm 2mm 1.6mm;text-align:right}
.ptable .cat td{background:#E2E6E9;font:700 7.6pt 'Inter';color:var(--msp-pink);letter-spacing:.03em;padding:1.3mm 2mm;vertical-align:middle}
.ptable .m td{font-size:8.1pt;padding:1.05mm 2mm;vertical-align:middle}
.ptable .m:nth-child(even) td{background:#F5F6F7}
.ptable .m .ic{width:11mm}
.ptable .m .ic img{width:7.5mm;height:5mm;object-fit:contain;display:block}
.ptable .m .nm{font-weight:500}
.ptable .m .pr{text-align:right;font-weight:600;white-space:nowrap}
.ptable .m .pr.poa{color:var(--muted);font-weight:500}
.ptable .thead td.oldh{color:#8A97A0}
.ptable .m .pr.old{color:#8A97A0;font-weight:500}
.ptable .m .pr.old.poa{color:var(--muted)}
.ptable tbody.grp{border-top:2mm solid transparent}
.smallnote{font-size:6.8pt;font-style:italic;line-height:1.45;color:#4A555E;margin-top:4mm}

/* POS tables */
h3.posh{font-size:10pt;font-weight:700;margin:3mm 0 1.5mm}
.ptable.pos{table-layout:fixed;width:100%;margin-bottom:2mm}
.ptable.pos .phead td{background:#E2E6E9;color:var(--msp-pink);font:700 7.6pt 'Inter';letter-spacing:.03em;padding:1.3mm 2mm;vertical-align:middle}
.ptable.pos .phead td.vh{text-align:right;white-space:nowrap}
.ptable.pos .m td{padding:1.05mm 2mm;font-size:8.1pt}
.ptable.pos .m .pr2{text-align:right;font-weight:600;white-space:nowrap}
.ptable.pos .m .pr2.poa{color:var(--muted);font-weight:500}
.ptable.pos .ic svg,.ptable.pos .ic img{width:7.5mm;height:5mm;object-fit:contain;display:block}
.ptable.pos .m .qtycell{text-align:right;font-weight:600;color:var(--ink)}
.ptable.pos .tot td{background:#E2E6E9;padding:1.6mm 2mm;font-size:8.6pt}
.ptable.pos .tot .lbl{text-align:right;font-weight:700}
.ptable.pos .tot .val{text-align:right;font-weight:700;font-size:9.6pt;white-space:nowrap}
.nieuw{color:var(--msp-pink);font-style:italic;font-weight:500;margin-left:1mm}
.posnote{font-size:6.6pt;line-height:1.45;color:var(--msp-pink);margin:0 0 2.5mm}
/* safety valve when content still runs long */
.pospage.xtight .ptable.pos .m td{padding:0.7mm 2mm}
.pospage.xtight .ptable.pos .phead td{padding:1mm 2mm}
.pospage.xtight .ptable.pos{margin-bottom:1.3mm}
.pospage.xtight h3.posh{margin:2mm 0 1mm}
.pospage.xtight .lead{margin-bottom:2mm}
/* legal */
.legal h2{font-size:12pt;font-weight:700;margin-bottom:3mm}
.legalbody{column-count:2;column-gap:9mm;font-size:7.2pt;line-height:1.5;color:#26313A;text-align:justify}
.legalbody h4{font-size:7.6pt;font-weight:700;margin:2.5mm 0 1mm;column-span:none}
.legalbody p{margin-bottom:2mm}
.legalbody ul{margin:0 0 2mm 3.5mm}
.legalbody ul.clauses{list-style:none;margin-left:0}
.legalbody ol{margin:0 0 2mm 3.5mm}
.legalbody li{margin-bottom:1.6mm}

/* extra afspraken */
.notes{background:#F2FAFE;border-left:1.2mm solid var(--msp-cyan);padding:4mm 5mm;border-radius:2mm;margin-top:6mm}
.notes h4{font-size:9pt;color:var(--msp-navy);margin-bottom:2mm}
.notes div{font-size:8.2pt;line-height:1.6;color:#26404F}

/* signature */
.sig .sigrow{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin:8mm 0 12mm}
.sig .sigrow .who{font-size:8.5pt}
.sig .sigrow .who b{display:block;margin-top:9mm}
.sig .sigrow .who span{color:#4A555E}
.sig h3.gd{font-size:11.5pt;font-weight:700;border-bottom:1.4px solid var(--ink);display:inline-block;padding-bottom:1mm;margin-bottom:6mm}
.sigfields{display:grid;grid-template-columns:34mm 1fr;gap:5.5mm 6mm;font-size:8.5pt;max-width:150mm}
.sigfields .lb{font-weight:700}
.sigfields .lb small{display:block;font-weight:400;font-size:6.6pt;color:#6B7780}
.sigfields .dots{border-bottom:1px dotted #9AA5AD;min-height:5mm;display:flex;align-items:flex-end;padding:0 1mm 0.6mm;font-size:8.5pt;color:#1A1517}
.sigfields .dots[contenteditable]:hover{background:#F5FAFD}
.sigfields .dots[contenteditable]:focus{outline:none;border-bottom-color:var(--msp-cyan);background:#F5FAFD}
.sigfields .dots.sigimg{height:18mm;border-bottom:1px dotted #9AA5AD}
.sigfields .dots.sigimg img{max-height:16mm;max-width:70mm;display:block}

/* ============ SIGN MODE (prospect) ============ */
body.signmode #docTypeSeg,body.signmode #savedSel,body.signmode #saveBtn,body.signmode #saveAsBtn,
body.signmode #delBtn,body.signmode #resetBtn,body.signmode #shareBtn,body.signmode #pdfBtn,
body.signmode #htmlBtn,body.signmode #libBtn,body.signmode #calcBtn{display:none!important}
.signpanel h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A97A0;margin:16px 0 8px}
.signpanel h3:first-child{margin-top:2px}
.signpanel .intro{font:500 12px 'Inter';color:#5A6B76;line-height:1.55;background:#F5FAFD;border-radius:8px;padding:10px;margin-bottom:12px}
.signpanel .fld input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:500 12.5px 'Inter'}
.signpanel .fld label{display:block;font:600 11.5px 'Inter';color:#5A6B76;margin-bottom:3px}
.signpanel canvas{width:100%;height:110px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.signpanel .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.signpanel .msg{font:600 11.5px 'Inter';margin-top:8px;color:#B23C5E}
.signpanel .msg.ok{color:#2E8B57}
.signdone{background:#EAF9F0;border-left:1.2mm solid #2E8B57;border-radius:8px;padding:12px;font:600 12.5px 'Inter';color:#1F6E45;line-height:1.5}
#shareModal{position:fixed;inset:0;background:rgba(11,54,82,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#shareModal .box{background:#fff;border-radius:12px;padding:22px;width:min(520px,92vw);box-shadow:0 18px 50px rgba(10,40,60,.3)}
#shareModal h4{font:800 15px 'Inter';color:var(--msp-navy);margin-bottom:6px}
#shareModal p{font:500 12.5px 'Inter';color:#5A6B76;line-height:1.55;margin-bottom:12px}
#shareModal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 12.5px 'Inter';margin-bottom:12px}
#shareModal .acts{display:flex;gap:8px;justify-content:flex-end}
.sigsub{font:700 9pt 'Inter';color:var(--msp-cyan2);margin:4mm 0 1mm;grid-column:1/3}

/* ============ CALC MODAL ============ */
#calcModal{position:fixed;inset:0;background:rgba(11,54,82,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#calcModal .box{background:#fff;border-radius:12px;padding:22px;width:min(680px,94vw);max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(10,40,60,.3)}
#calcModal h4{font:800 15px 'Inter';color:var(--msp-navy);margin-bottom:6px}
#calcModal .lead{font:500 12px 'Inter';color:#5A6B76;line-height:1.55;margin-bottom:12px}
#calcModal table{width:100%;border-collapse:collapse;margin:10px 0}
#calcModal th{font:700 10.5px 'Inter';color:var(--msp-cyan2);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
#calcModal th.r,#calcModal td.r{text-align:right}
#calcModal td{font:500 12px 'Inter';color:#1A1517;padding:5px 6px;border-bottom:1px solid #EEF1F3;vertical-align:middle}
#calcModal td.rate{color:#5A6B76;white-space:nowrap}
#calcModal input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:500 12px 'Inter';text-align:right}
#calcModal input.aov{width:140px;text-align:left}
#calcModal .rev{font-weight:700;white-space:nowrap}
#calcModal .total td{font:800 13px 'Inter';color:var(--msp-navy);border-top:2px solid var(--msp-navy);border-bottom:none;padding-top:8px}
#calcModal .note{font:500 11px 'Inter';color:#8A97A0;line-height:1.5;margin-top:8px}
#calcModal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* ============ PRINT ============ */
@page{size:A4;margin:0}
html,body,*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
@media print{
  html,body{background:#fff}
  #topbar,#sidebar{display:none!important}
  #app,#main{display:block;height:auto;overflow:visible}
  #preview{padding:0;gap:0;display:block;overflow:visible}
  .page{box-shadow:none;page-break-after:always;margin:0}
  .page:last-child{page-break-after:auto}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  const F=S.fields, isP=S.docType==='partner';
  let h=`<h3>Gegevens</h3>
    <div class="fld"><label>${isP?'Partner':'Merchant'} (bedrijfsnaam)</label><input data-f="bedrijf" value="${esc(F.bedrijf)}"></div>
    <div class="fld"><label>Datum voorstel</label><input data-f="datum" value="${esc(F.datum)}"></div>
    ${isP?'':`<div class="fld"><label>Voorstel geldig tot</label><input data-f="geldig" value="${esc(F.geldig)}" placeholder="bijv. 30-09-2026"></div>`}
    <div class="fld"><label>Contractperiode</label><input data-f="periode" value="${esc(F.periode)}"></div>
    ${isP?`<div class="fld"><label>Gemaakt door</label><input data-f="auteur" value="${esc(F.auteur)}"></div>`:''}
  ${(isP||S.pages.pos)?`<div class="fld"><label>Korting POS hardware (%)</label><input id="poskorting" type="number" min="0" max="100" step="0.5" value="${S.poskorting||0}"></div>`:''}
  ${S.docType==='merchant'?`<h3>Vergelijking</h3>
    <label class="chk"><input type="checkbox" id="vglOn" ${S.vergelijk?'checked':''}> Kolom met huidige tarieven</label>
    ${S.vergelijk?`<div class="fld" style="margin-top:6px"><label>Koptekst kolom</label><input id="vglLabel" value="${esc(S.vergelijkLabel||'Huidig tarief')}"></div>
    <div class="hint">Vul per betaalmethode het huidige tarief in door in de tabel op de streep te klikken.</div>`:''}`:''}
  <h3>Pagina's</h3>`;
  const pageDefs = S.docType==='pos'
    ? [['cover','Voorblad'],['pos','Offerte POS hardware'],['sig','Ondertekening']]
    : [['cover','Voorblad'],['product','Acquirer & integraties'],['benefits','Verbeter uw business'],
    ['agreement', isP?'Samenwerkingsvoorstel (artikelen)':'Samenwerkingsovereenkomst'],['financieel','Financieel voorstel'],
    ['notes','Aanvullende afspraken'],['tabel',isP?'Tarief ECOM transacties':'Tarieven per betaalmethode'],['pos','Tarief POS transacties'],['sig','Ondertekening']];
  for(const [k,l] of pageDefs) h+=`<label class="chk"><input type="checkbox" data-p="${k}" ${S.pages[k]?'checked':''}> ${l}</label>`;
  if(S.docType==='pos'){
    h+=`<h3>POS hardware</h3>`;
    S.pos.hw.forEach((r,i)=>{
      const q=+(S.qty[i]||0);
      h+=`<div class="qrow"><label class="qname"><input type="checkbox" data-hw="${i}" ${r.on===false?'':'checked'}> ${esc(r.name)}</label>`+
         `<input type="number" min="0" step="1" inputmode="numeric" placeholder="0" data-qty="${i}" value="${q||''}" ${r.on===false?'disabled':''}></div>`;
    });
    h+=`<div class="hint">Kies per device het aantal. Alleen devices met een aantal verschijnen in de offerte; prijzen en het totaal rekenen automatisch door.</div>`;
    sb.innerHTML=h;
    sb.querySelectorAll('input[data-f]').forEach(el=>el.addEventListener('input',()=>{S.fields[el.dataset.f]=el.value; renderPreview();}));
    sb.querySelectorAll('input[data-p]').forEach(el=>el.addEventListener('change',()=>{S.pages[el.dataset.p]=el.checked; renderPreview();}));
    const pk0=sb.querySelector('#poskorting');
    if(pk0) pk0.addEventListener('input',()=>{ S.poskorting=parseFloat(pk0.value)||0; S.pos.hw.forEach(r=>{r.man=null;}); renderPreview(); });
    sb.querySelectorAll('[data-qty]').forEach(el=>el.addEventListener('input',()=>{ S.qty[el.dataset.qty]=Math.max(0,parseInt(el.value)||0); renderPreview(); }));
    sb.querySelectorAll('[data-hw]').forEach(el=>el.addEventListener('change',()=>{ S.pos.hw[el.dataset.hw].on=el.checked; renderSidebar(); renderPreview(); }));
    return;
  }
  if(S.pages.pos){
    h+=`<h3>POS hardware</h3>`;
    S.pos.hw.forEach((r,i)=>{
      h+=`<label class="rowchk"><input type="checkbox" data-hw="${i}" ${r.on===false?'':'checked'}> ${esc(r.name)}</label>`;
    });
  }
  h+=`<h3>Betaalmethoden</h3>`;
  let cat='';
  S.rows.forEach((r,i)=>{
    if(r.cat!==cat){cat=r.cat;
      h+=`<label class="cat-head" style="display:flex;align-items:center;gap:7px;cursor:pointer"><input type="checkbox" data-cat="${esc(cat)}" style="accent-color:var(--msp-pink)"> ${cat}</label>`;}
    h+=`<label class="rowchk"><input type="checkbox" data-r="${i}" ${r.on?'checked':''}><img src="${A[r.key]||''}" onerror="this.style.visibility='hidden'"> ${esc(r.name)}</label>`;
  });
  h+=`<div class="hint">Klik op tekst in het voorbeeld (prijzen, titels, alinea's) om deze direct te bewerken. Grijze prijzen = "Prijs op aanvraag"; typ een bedrag en de rij kleurt zwart. Tarieven per betaalmethode voer je in excl. transactiekosten — de tabel toont automatisch het gecombineerde tarief (klik op een prijs om het kale tarief te bewerken).</div>`;
  sb.innerHTML=h;
  sb.querySelectorAll('input[data-f]').forEach(el=>el.addEventListener('input',e=>{S.fields[el.dataset.f]=el.value; renderPreview();}));
  sb.querySelectorAll('input[data-p]').forEach(el=>el.addEventListener('change',()=>{S.pages[el.dataset.p]=el.checked; if(el.dataset.p==='pos'){renderSidebar();} renderPreview();}));
  const vgl=sb.querySelector('#vglOn');
  if(vgl) vgl.addEventListener('change',()=>{ S.vergelijk=vgl.checked; renderSidebar(); renderPreview(); });
  const vglL=sb.querySelector('#vglLabel');
  if(vglL) vglL.addEventListener('input',()=>{ S.vergelijkLabel=vglL.value; renderPreview(); });
  sb.querySelectorAll('input[data-hw]').forEach(el=>el.addEventListener('change',()=>{ S.pos.hw[el.dataset.hw].on=el.checked; renderPreview(); }));
  sb.querySelectorAll('input[data-r]').forEach(el=>el.addEventListener('change',()=>{S.rows[el.dataset.r].on=el.checked; syncCatBoxes(); renderPreview();}));
  sb.querySelectorAll('input[data-cat]').forEach(el=>{
    el.addEventListener('change',()=>{
      S.rows.forEach(r=>{ if(r.cat===el.dataset.cat) r.on=el.checked; });
      sb.querySelectorAll('input[data-r]').forEach(rc=>{ rc.checked=S.rows[rc.dataset.r].on; });
      syncCatBoxes(); renderPreview();
    });
  });
  function syncCatBoxes(){
    sb.querySelectorAll('input[data-cat]').forEach(el=>{
      const rows=S.rows.filter(r=>r.cat===el.dataset.cat);
      const on=rows.filter(r=>r.on).length;
      el.checked = on===rows.length && on>0;
      el.indeterminate = on>0 && on<rows.length;
    });
  }
  syncCatBoxes();
  const pk=sb.querySelector('#poskorting');
  if(pk) pk.addEventListener('input',()=>{
    S.poskorting=parseFloat(pk.value)||0;
    S.pos.hw.forEach(r=>{ r.man=null; });   // new % regenerates the whole column
    renderPreview();
  });
}

/* split the pricing table across pages: whole category sections move to a follow-up page when they overflow */
function paginateTables(){
  const pv=document.getElementById('preview');
  let page=pv.querySelector('.page.tabelpage');
  let guard=0;
  while(page && guard++<6){
    const pad=page.querySelector('.pad');
    const table=page.querySelector('table.ptable');
    if(!table) break;
    const note=page.querySelector('.smallnote');
    const pageRect=page.getBoundingClientRect();
    const mm=pageRect.height/297;                     // px per mm
    const limit=pageRect.top + (297-24)*mm;           // keep 24mm free for footer
    const grps=[...table.querySelectorAll('tbody.grp')];
    let splitAt=-1;
    for(let i=0;i<grps.length;i++){
      if(grps[i].getBoundingClientRect().bottom>limit){ splitAt=i; break; }
    }
    const noteOverflows = splitAt===-1 && note && note.getBoundingClientRect().bottom>limit;
    if(splitAt===-1 && !noteOverflows) break;
    if(splitAt===0) splitAt=1;                        // never leave a page empty
    // build continuation page
    const next=document.createElement('div');
    next.className='page tabelpage';
    next.innerHTML=`<div class="pad">${logoBlock()}<table class="ptable">${table.querySelector('thead').outerHTML}</table>${foot()}</div>`;
    const nextTable=next.querySelector('table.ptable');
    if(splitAt>-1) grps.slice(splitAt).forEach(g=>nextTable.appendChild(g)); else nextTable.remove();
    // footnote always follows the last table section
    next.querySelector('.pad').insertBefore(note, next.querySelector('.pfoot'));
    page.after(next);
    page=next;
  }
}

function parsePrice(s){
  if(!s) return null;
  const m=String(s).replace(/[\u20ac\s]/g,'').replace(/,-$/,'').replace(',','.');
  const v=parseFloat(m);
  return isNaN(v)?null:v;
}
function composePrice(raw){
  const tx=parsePrice(S.fields.txkosten);
  if(!raw || /aanvraag|all-?incl/i.test(raw) || !tx || tx<=0) return raw;
  const m=raw.match(/^\u20ac\s*([\d.,]+)\s*(.*)$/);
  if(m){
    const base=parseFloat(m[1].replace(',','.'));
    if(!isNaN(base)){
      const rest=m[2].replace(/^\+\s*/,'').trim();
      const sum='\u20ac '+(base+tx).toFixed(2).replace('.',',');
      return rest ? sum+' + '+rest : sum;
    }
  }
  return '\u20ac '+tx.toFixed(2).replace('.',',')+' + '+raw;
}
function hwTarief(row){
  if(row.man!=null && row.man!=='') return row.man;
  const k=parseFloat(S.poskorting)||0;
  if(k<=0) return row.def;
  const n=parsePrice(row.def);
  if(n==null) return row.def;
  return '\u20ac '+(n*(1-k/100)).toFixed(2).replace('.',',');
}
function posSync(path, val){
  const m=path.match(/^(nondom|credit)\.(\d+)\.val$/);
  if(!m) return;
  const from=m[1], i=+m[2], row=S.pos[from][i];
  if(!row || (row.k!=='visa' && row.k!=='mastercard')) return;
  ['nondom','credit'].forEach(list=>{
    S.pos[list].forEach((r,j)=>{
      if((r.k==='visa'||r.k==='mastercard') && !(list===from && j===i)){
        r.val=val;
        const oEl=document.querySelector(`#preview [data-pos="${list}.${j}.val"]`);
        if(oEl && oEl!==document.activeElement){ oEl.textContent=val; oEl.classList.toggle('poa', /n\.v\.t|aanvraag/i.test(val)); }
      }
    });
  });
}
function euroFmt(v){
  const t=String(v).trim();
  if(!t) return t;
  if(/[a-z%]/i.test(t)) return t;
  const n=parseFloat(t.replace(/[\u20ac\s.]/g,'').replace(',','.'));
  if(isNaN(n)) return t;
  return '\u20ac '+n.toFixed(2).replace('.',',');
}
function posNum(x){ const v=parsePrice(x); return v==null?0:v; }
function posTotals(){
  let units=0, one=0;
  S.pos.hw.forEach((r,i)=>{ if(r.on===false) return; const q=+(S.qty[i]||0); if(q>0){ units+=q; one+=q*posNum(hwTarief(r)); } });
  return {units, one};
}

function renderPreview(){
  const pv=document.getElementById('preview');
  let h='';
  if(S.docType==='pos'){
    if(S.pages.cover) h+=pgCover();
    if(S.pages.pos) h+=pgPos();
    if(S.pages.sig) h+=pgSig();
  } else {
  if(S.pages.cover) h+=pgCover();
  if(S.pages.product) h+=pgProduct();
  if(S.pages.benefits) h+=pgBenefits();
  if(S.docType==='partner' && S.pages.agreement) h+=pgAgreement();
  if(S.pages.financieel) h+=pgFinancieel();
  if(S.pages.tabel) h+=pgTabel();
  if(S.pages.pos) h+=pgPos();
  if(S.docType==='merchant' && S.pages.agreement) h+=pgAgreement();
  if(S.pages.sig) h+=pgSig();
  }
  pv.innerHTML=h;
  paginateTables();
  // POS page must never run into the footer: tighten automatically if it would
  pv.querySelectorAll('.page.pospage').forEach(pg=>{
    const rect=pg.getBoundingClientRect(), mm=rect.height/297, limit=rect.top+(297-20)*mm;
    const tables=pg.querySelectorAll('.ptable.pos');
    const last=tables[tables.length-1];
    if(last && last.getBoundingClientRect().bottom>limit) pg.classList.add('xtight');
  });
  // page numbers
  pv.querySelectorAll('.page').forEach((p,i)=>{ const pn=p.querySelector('.pn'); if(pn) pn.textContent='Paginanummer: '+(i+1); });
  // bindings: price edits (Mastercard <-> Visa <-> Maestro stay identical)
  const SYNC=['mastercard','visa','maestro'];
  function syncCard(el, valOverride){
    const i=+el.dataset.price, r=S.rows[i];
    if(!r || !SYNC.includes(r.key)) return;
    const val=(valOverride!==undefined)?valOverride:el.textContent.trim();
    S.rows.forEach((x,xi)=>{
      if(xi!==i && SYNC.includes(x.key)){
        x.price=val;
        const oEl=pv.querySelector(`[data-price="${xi}"]`);
        if(oEl && oEl!==el && oEl!==document.activeElement){ oEl.textContent=composePrice(val); oEl.classList.toggle('poa',/aanvraag/i.test(val)); }
      }
    });
  }
  pv.querySelectorAll('[data-oud]').forEach(el=>{
    el.addEventListener('focus',()=>{ if(el.textContent.trim()==='\u2014') el.textContent=''; });
    el.addEventListener('blur',()=>{
      const i=el.dataset.oud; let v=el.textContent.trim();
      if(!S.oud) S.oud={};
      if(v===''){ delete S.oud[i]; el.textContent='\u2014'; el.classList.add('poa'); return; }
      const f=euroFmt(v); if(f!==v){ v=f; el.textContent=v; }
      S.oud[i]=v; el.classList.remove('poa');
    });
  });
  pv.querySelectorAll('[data-cmplabel]').forEach(el=>el.addEventListener('blur',()=>{
    S.vergelijkLabel=el.textContent.trim()||'Huidig tarief'; renderSidebar();
  }));
  pv.querySelectorAll('[data-price]').forEach(el=>{
    el.addEventListener('focus',()=>{ const i=+el.dataset.price; const raw=S.rows[i].price;
      el.textContent=/aanvraag/i.test(raw)?'':raw; });
    el.addEventListener('blur',()=>{ const i=+el.dataset.price;
      let v=el.textContent.trim(); if(v==='') v='Prijs op aanvraag';
      else if(!/%/.test(v) && !/^€/.test(v) && /^\d/.test(v)) v='€ '+v;
      S.rows[i].price=v;
      el.classList.toggle('poa', /aanvraag/i.test(v)); syncCard(el, v);
      const rr=S.rows[i]; el.textContent=(rr.key==='applepay'||rr.key==='googlepay')?rr.price:composePrice(rr.price); });
    el.addEventListener('input',()=>{ el.classList.toggle('poa', /aanvraag/i.test(el.textContent)); syncCard(el); });

        el.textContent=c; el.classList.toggle('poa', /n\.v\.t|aanvraag/i.test(c)); return; }

    });

  // fee edits
  pv.querySelectorAll('[data-fee]').forEach(el=>el.addEventListener('blur',()=>{

/* deliver a generated file — tries every route a viewer's browser allows */
async function deliverFile(filename, blob){
  let dl=null;
  try{ dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename, data:blob}); return 'saved'; }
    catch(err){ if(err&&err.code==='declined') return 'declined'; }
  }
  // anchor download
  try{
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=filename; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},4000);
    return 'saved';
  }catch(e){}
  // last resort: open it in a tab so it can be saved manually
  try{
    const url=URL.createObjectURL(blob);
    const w=window.open(url,'_blank');
    if(w){ setTimeout(()=>URL.revokeObjectURL(url),60000); return 'opened'; }
  }catch(e){}
  return 'failed';
}

/* ---------- saved proposals ----------
   Each proposal is one document: the whole editor state plus any text
   edited directly in the preview. Stored server-side when the artifact's
   store is available, otherwise in this browser. */
let DB=null, CUR=null, SAVED=[];
/* Proposals are stored in the signed-in team member's own account. The host page
   owns the authenticated connection; this document asks it over postMessage and
   falls back to this browser when no host is present. */
const HOST = (window.parent && window.parent!==window) ? window.parent : null;
let REMOTE=false, RPC_N=0; const RPC={};
function host(op,payload){
  if(!HOST) return Promise.reject(new Error('no host'));
  return new Promise((res,rej)=>{
    const id=++RPC_N; RPC[id]={res,rej};
    HOST.postMessage({__msp:true,id,op,payload:payload||{}},'*');
    setTimeout(()=>{ if(RPC[id]){ delete RPC[id]; rej(new Error('timeout')); } },20000);
  });
}
window.addEventListener('message',ev=>{
  const d=ev.data;
  if(d && d.__mspOpen){ loadProposal(d.__mspOpen); return; }
  if(!d || !d.__mspReply) return;
  const p=RPC[d.id]; if(!p) return; delete RPC[d.id];
  if(d.error) p.rej(new Error(d.error)); else p.res(d.result);
});
const LSKEY='msp_proposals_v1';
let MEM={}, LS_OK=null;
function lsUsable(){
  if(LS_OK!==null) return LS_OK;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); LS_OK=true; }
  catch(e){ LS_OK=false; }
  return LS_OK;
}
function lsAll(){
  if(!lsUsable()) return MEM;
  try{ return JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch(e){ return MEM; }
}
function lsPut(id,rec){
  if(!lsUsable()){ MEM[id]=rec; return; }
  const a=lsAll(); a[id]=rec;
  try{ localStorage.setItem(LSKEY, JSON.stringify(a)); }catch(e){ MEM=a; LS_OK=false; }
}
function lsDel(id){
  if(!lsUsable()){ delete MEM[id]; return; }
  const a=lsAll(); delete a[id];
  try{ localStorage.setItem(LSKEY, JSON.stringify(a)); }catch(e){ MEM=a; LS_OK=false; }
}
function flash(msg, ok){ const el=document.getElementById('saveState'); el.textContent=msg; el.className='savestate'+(ok?' ok':''); if(msg) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; },2600); }

/* text typed straight into the preview lives in the DOM — capture and restore it */
function captureEdits(){

    if(el.dataset.price||el.dataset.pos||el.dataset.posman||el.dataset.fee||el.dataset.bind||el.dataset.notes) return;

function applyEdits(map){

    if(el.dataset.price||el.dataset.pos||el.dataset.posman||el.dataset.fee||el.dataset.bind||el.dataset.notes) return;

function snapshotState(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  return { state: JSON.parse(JSON.stringify(S)), edits: captureEdits(), copy: JSON.parse(JSON.stringify(COPY)) };
}
function restoreState(rec){
  S = rec.state;
  if(rec.copy) Object.keys(rec.copy).forEach(k=>{ if(COPY[k]) COPY[k]=rec.copy[k]; });
  renderAll();
  applyEdits(rec.edits);
}
async function initStore(){
  // Account store: proposals are saved under the signed-in team member and are
  // visible only to that member. Falls back to this browser when no host page
  // is available (e.g. the standalone file).
  DB=null; REMOTE=false;
  try{
    await host('list');
    REMOTE=true;
  }catch(e){ REMOTE=false; }
  await refreshSaved();
}
async function refreshSaved(){
  SAVED=[];
  if(REMOTE){
    try{
      const rows=await host('list');
      SAVED=(rows||[]).map(r=>({id:r.id,name:r.name,docType:r.docType,updatedAt:r.updatedAt}));
    }catch(e){ REMOTE=false; }
  }
  if(!REMOTE){
    const a=lsAll();
    SAVED=Object.keys(a).map(id=>({id, name:a[id].name, docType:a[id].docType, updatedAt:a[id].updatedAt}))
      .sort((x,y)=>String(y.updatedAt).localeCompare(String(x.updatedAt)));
  }
  const sel=document.getElementById('savedSel');
  if(!lsUsable()) flash('Opslag beperkt tot deze sessie');
  sel.innerHTML='<option value="">— Opgeslagen voorstellen —</option>'+
    SAVED.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.docType==='partner'?'partner':'merchant'})</option>`).join('');
  if(CUR) sel.value=CUR;
}
async function saveProposal(asNew){
  const suggested=(S.fields.bedrijf||'Voorstel').trim();
  let name=suggested, id=CUR;
  if(asNew||!CUR){
    name=prompt('Naam van dit voorstel:', suggested);
    if(name===null) return;
    name=name.trim()||suggested;
    id='p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  } else {
    const ex=SAVED.find(p=>p.id===CUR); if(ex) name=ex.name;
  }
  const rec={ name, docType:S.docType, updatedAt:new Date().toISOString(), payload:JSON.stringify(snapshotState()) };
  flash('Opslaan\u2026');
  try{
    if(REMOTE){
      await host('save',{id, name:rec.name, docType:rec.docType, payload:rec.payload});
      CUR=id; await refreshSaved();
      document.getElementById('savedSel').value=id;
      flash('Opgeslagen \u2713', true);

}

/* ---------- text-native PDF renderer ----------
   Walks the rendered pages and redraws them into the PDF as real vector
   objects: text stays selectable, rules and fills are drawn as shapes,
   only bitmap/SVG artwork is embedded as an image. */
function cssColor(str){
  const m=String(str).match(/rgba?\(([^)]+)\)/);
  if(!m) return null;
  const p=m[1].split(',').map(s=>parseFloat(s));
  if(p.length>3 && p[3]===0) return null;
  return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1};
}
function svgToPng(svgEl, scale){
  return new Promise(res=>{
    const rb=svgEl.getBoundingClientRect();
    const vb=svgEl.viewBox&&svgEl.viewBox.baseVal;
    const par=(svgEl.getAttribute('preserveAspectRatio')||'').trim();
    let r={width:rb.width,height:rb.height};
    if(vb&&vb.width>0&&vb.height>0&&par!=='none'){
      const s=Math.min(rb.width/vb.width, rb.height/vb.height);
      r={width:vb.width*s, height:vb.height*s};
    }
    const clone=svgEl.cloneNode(true);
    clone.setAttribute('width', r.width);
    clone.setAttribute('height', r.height);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const str=new XMLSerializer().serializeToString(clone);
    const url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(str)));
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(r.width*scale)); c.height=Math.max(1,Math.round(r.height*scale));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/png'));
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}
async function buildVectorPdf(onProgress){
  if(document.activeElement) document.activeElement.blur();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  const pages=[...document.querySelectorAll('#preview .page')];
  for(let pi=0; pi<pages.length; pi++){
    if(onProgress) onProgress(`Pagina ${pi+1}/${pages.length}\u2026`);
    const page=pages[pi];
    const pr=page.getBoundingClientRect();
    const K=210/pr.width;                       // px -> mm
    const X=x=>(x-pr.left)*K, Y=y=>(y-pr.top)*K;
    if(pi>0) pdf.addPage();

    // 1. fills and rules
    page.querySelectorAll('*').forEach(el=>{
      if(el.closest('svg')) return;
      const cs=getComputedStyle(el), r=el.getBoundingClientRect();
      if(r.width<=0||r.height<=0) return;
      const bg=cssColor(cs.backgroundColor);
      if(bg){ pdf.setFillColor(bg.r,bg.g,bg.b); pdf.rect(X(r.left),Y(r.top),r.width*K,r.height*K,'F'); }
      [['Top',r.left,r.top,r.right,r.top],['Bottom',r.left,r.bottom,r.right,r.bottom],
       ['Left',r.left,r.top,r.left,r.bottom],['Right',r.right,r.top,r.right,r.bottom]].forEach(([side,x1,y1,x2,y2])=>{
        const w=parseFloat(cs['border'+side+'Width'])||0;
        if(w<=0) return;
        const st=cs['border'+side+'Style'];
        if(st==='none'||st==='hidden') return;
        const bc=cssColor(cs['border'+side+'Color']); if(!bc) return;
        pdf.setDrawColor(bc.r,bc.g,bc.b); pdf.setLineWidth(Math.max(w*K,0.1));
        if(st==='dotted') pdf.setLineDashPattern([0.6,0.9],0); else if(st==='dashed') pdf.setLineDashPattern([1.6,1],0);
        pdf.line(X(x1),Y(y1),X(x2),Y(y2));
        pdf.setLineDashPattern([],0);
      });
    });

    // 2. artwork (bitmaps + inline SVG)
    for(const node of page.querySelectorAll('img, svg')){
      if(node.tagName.toLowerCase()==='svg' && node.parentElement.closest('svg')) continue;
      const r=node.getBoundingClientRect();
      if(r.width<=0||r.height<=0) continue;
      if(node.tagName.toLowerCase()==='svg'){
        let dw=r.width, dh=r.height, dx=r.left, dy=r.top;
        const vb=node.viewBox&&node.viewBox.baseVal;
        const par=(node.getAttribute('preserveAspectRatio')||'').trim();
        if(vb&&vb.width>0&&vb.height>0&&par!=='none'){
          const s=Math.min(r.width/vb.width, r.height/vb.height);
          dw=vb.width*s; dh=vb.height*s; dx=r.left+(r.width-dw)/2; dy=r.top+(r.height-dh)/2;
        }
        const scale=Math.min(8, Math.max(3, 700/Math.max(dw,1)));
        const data=await svgToPng(node, scale);
        if(data) pdf.addImage(data,'PNG',X(dx),Y(dy),dw*K,dh*K,undefined,'FAST');
        continue;
      }
      try{
        const img=node;
        const fit=getComputedStyle(img).objectFit||'fill';
        const nw=img.naturalWidth||r.width, nh=img.naturalHeight||r.height;
        const c=document.createElement('canvas');
        const isPhoto=r.width*K>60;
        if(fit==='cover'){
          // crop the source to the box aspect — never squash
          const s=Math.max(r.width/nw, r.height/nh);
          const sw=Math.min(nw, r.width/s), sh=Math.min(nh, r.height/s);
          const sx=(nw-sw)/2, sy=(nh-sh)/2;
          const q=Math.min(3, Math.max(2, 1400/Math.max(r.width,1)));
          c.width=Math.max(1,Math.round(r.width*q)); c.height=Math.max(1,Math.round(r.height*q));
          const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
          pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',X(r.left),Y(r.top),r.width*K,r.height*K,undefined,'FAST');
        } else {
          let dw=r.width, dh=r.height, dx=r.left, dy=r.top;
          if(fit==='contain'||fit==='scale-down'){
            const s=Math.min(r.width/nw, r.height/nh);
            dw=nw*s; dh=nh*s; dx=r.left+(r.width-dw)/2; dy=r.top+(r.height-dh)/2;
          }
          const q=Math.min(4, Math.max(2.5, 1200/Math.max(dw,1)));
          c.width=Math.max(1,Math.round(dw*q)); c.height=Math.max(1,Math.round(dh*q));
          const ctx=c.getContext('2d');
          if(isPhoto){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); }
          ctx.drawImage(img,0,0,c.width,c.height);
          pdf.addImage(c.toDataURL(isPhoto?'image/jpeg':'image/png',0.92), isPhoto?'JPEG':'PNG',
            X(dx),Y(dy),dw*K,dh*K,undefined,'FAST');
        }
      }catch(e){}
    }

    // 2b. list markers — bullets and numbers are generated content, so draw them explicitly
    page.querySelectorAll('li').forEach(li=>{
      const cs=getComputedStyle(li);
      if(cs.listStyleType==='none'||cs.display==='none') return;
      const lr=li.getBoundingClientRect(); if(lr.width<=0) return;
      // vertical position of the li's first text line
      let top=lr.top, bottom=lr.top+parseFloat(cs.lineHeight||cs.fontSize)||lr.bottom;
      try{
        const rng=document.createRange(); rng.selectNodeContents(li);
        const rc=rng.getClientRects()[0];
        if(rc){ top=rc.top; bottom=rc.bottom; }
      }catch(e){}
      const type=cs.listStyleType;
      let marker='\u2022';
      if(type!=='disc'&&type!=='circle'&&type!=='square'){
        const sibs=[...li.parentElement.children].filter(n=>n.tagName==='LI');
        marker=(sibs.indexOf(li)+1)+'.';
      }
      const col=cssColor(cs.color)||{r:0,g:0,b:0};
      const sizePt=parseFloat(cs.fontSize)*K*2.83465;
      pdf.setTextColor(col.r,col.g,col.b);
      pdf.setFont('helvetica','normal');
      pdf.setFontSize(type==='disc'||type==='circle'||type==='square'?sizePt*0.95:sizePt);
      const w=pdf.getTextWidth(marker);
      const gap=Math.max(1.1, parseFloat(cs.fontSize)*K*0.55);   // breathing room, like the browser's marker
      const xRight=X(lr.left)-gap;
      pdf.text(marker, Math.max(0,xRight-w), Y((top+bottom)/2), {baseline:'middle'});
    });

    // 3. text, line by line, positioned exactly where the browser laid it out
    const walker=document.createTreeWalker(page, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        if(n.parentElement.closest('svg')) return NodeFilter.FILTER_REJECT;
        const cs=getComputedStyle(n.parentElement);
        if(cs.visibility==='hidden'||cs.display==='none'||parseFloat(cs.opacity)===0) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }});
    let node;
    while((node=walker.nextNode())){
      const el=node.parentElement, cs=getComputedStyle(el);
      const col=cssColor(cs.color)||{r:0,g:0,b:0};
      const sizePt=parseFloat(cs.fontSize)*K*2.83465;
      const weight=parseInt(cs.fontWeight)||400;
      const italic=cs.fontStyle==='italic';
      pdf.setTextColor(col.r,col.g,col.b);
      pdf.setFont('helvetica', weight>=600?(italic?'bolditalic':'bold'):(italic?'italic':'normal'));
      pdf.setFontSize(sizePt);
      // group words into visual lines using their client rects
      const text=node.nodeValue;
      const rng=document.createRange();
      const lines=[]; let cur=null;
      const re=/\S+/g; let m;
      while((m=re.exec(text))){
        rng.setStart(node,m.index); rng.setEnd(node,m.index+m[0].length);
        const rects=rng.getClientRects(); if(!rects.length) continue;
        const rc=rects[0];
        if(cur && Math.abs(rc.top-cur.top)<1.2){ cur.words.push(m[0]); cur.right=Math.max(cur.right,rc.right); }
        else { cur={top:rc.top,bottom:rc.bottom,left:rc.left,right:rc.right,words:[m[0]]}; lines.push(cur); }
      }
      for(const ln of lines){
        const str=ln.words.join(' ');
        const yMid=Y((ln.top+ln.bottom)/2);
        try{ pdf.text(str, X(ln.left), yMid, {baseline:'middle'}); }catch(e){}
      }
    }
  }
  return pdf;
}

/* Standalone print file: the document as its own HTML file. Opened locally,
   the browser's own print engine writes the PDF — same route as Word's export. */
document.getElementById('htmlBtn').addEventListener('click', async ()=>{
  const btn=document.getElementById('htmlBtn'); const orig='Print-bestand';
  if(document.activeElement) document.activeElement.blur();
  try{
    const styles=[...document.querySelectorAll('style')].map(n=>n.outerHTML).join('');
    const title=pdfFilename().replace(/\.pdf$/,'');
    const doc='<!DOCTYPE html>\n<html lang="nl"><head><meta charset="utf-8"><title>'+title+'</title>'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">'+
      styles+
      '<style>*,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}'+
      'body{background:#fff;margin:0}#pv{display:block}#pv .page{box-shadow:none;margin:0 auto}'+
      '#pv [contenteditable]:hover,#pv [contenteditable]:focus{outline:none}'+
      '@media print{#pv .page{page-break-after:always}#pv .page:last-child{page-break-after:auto}}</style>'+
      '</head><body><div id="pv">'+document.getElementById('preview').innerHTML+'</div>'+
      '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},500);});<\/script>'+

    const r=await deliverFile(fname, blob);
    btn.textContent = r==='saved'?'Opgeslagen \u2713' : r==='opened'?'Geopend in tabblad' : r==='declined'?orig : 'Opslaan geblokkeerd';
  }catch(e){ btn.textContent=(e&&e.code==='declined')?orig:'Opslaan mislukt'; }
  setTimeout(()=>btn.textContent=orig, 2600);
});

/* paste as plain text everywhere in the preview — strip colours/formatting from copied rates */
document.getElementById('preview').addEventListener('paste', e=>{
  const t=e.target.closest ? e.target.closest('[contenteditable]') : null;

/* ---------- PDF export ---------- */
const pdfBtn = document.getElementById('pdfBtn');
async function makePdfBlob(onProgress){
  if(document.activeElement) document.activeElement.blur();
  const pages=[...document.querySelectorAll('#preview .page')];
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  for(let i=0;i<pages.length;i++){
    if(onProgress) onProgress(`Pagina ${i+1}/${pages.length}…`);
    const canvas = await html2canvas(pages[i], {scale:2.2, backgroundColor:'#ffffff', logging:false});
    const img = canvas.toDataURL('image/jpeg', 0.92);
    if(i>0) pdf.addPage();
    pdf.addImage(img, 'JPEG', 0, 0, 210, 297);
  }
  return pdf.output('blob');
}
function pdfFilename(){
  const b=(S.fields.bedrijf||'voorstel').replace(/[\\/:*?"<>|\[\]]/g,'').trim()||'voorstel';
  const t=S.docType==='partner'?'Partner overeenkomst':'Voorstel';
  return `${t} MultiSafepay - ${b}.pdf`;
}
pdfBtn.addEventListener('click', async ()=>{
  if(pdfBtn.dataset.busy) return;
  pdfBtn.dataset.busy='1'; const orig=pdfBtn.textContent;
  try{
    if(typeof html2canvas==='undefined' || !window.jspdf){
      pdfBtn.textContent='PDF-libs niet geladen — gebruik Print'; setTimeout(()=>{pdfBtn.textContent=orig; delete pdfBtn.dataset.busy;},3000);
      return;
    }
    const blob = await makePdfBlob(t=>pdfBtn.textContent=t);
    pdfBtn.textContent='Opslaan…';
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if(dl){
      try{
        await dl.save({filename: pdfFilename(), data: blob});
        pdfBtn.textContent='Opgeslagen ✓';
      }catch(err){
        if(err && err.code==='declined'){ pdfBtn.textContent=orig; }
        else if(err && err.code==='rate_limited'){ pdfBtn.textContent='Even wachten en opnieuw proberen'; }
        else { pdfBtn.textContent='Opslaan mislukt — probeer Print'; }
      }
    } else {
      window.print();
      pdfBtn.textContent=orig;
    }
  }catch(e){
    pdfBtn.textContent='Fout bij genereren — probeer Print';
  }
  setTimeout(()=>{pdfBtn.textContent=orig; delete pdfBtn.dataset.busy;}, 2600);
});

/* ---------- delen met prospect + ondertekening ---------- */
const API='/api/public/proposals';
const QS=new URLSearchParams(location.search);
const SIGN_TOKEN=QS.get('sign');
const SHARESKEY='msp_shares_v1';

function sigFieldDefs(isP){
  return [
    {key:'partij', label:(isP?'Partner':'Merchant')+':'},

function sharesAll(){ try{ return JSON.parse(localStorage.getItem(SHARESKEY)||'{}'); }catch(e){ return {}; } }

/* ---------- creator: deellink maken ---------- */
function showShareLink(token){

  const old=document.getElementById('shareModal'); if(old) old.remove();

  wrap.id='shareModal';

    <input id="shareUrl" readonly value="${esc(url)}">
    <div class="acts">
      <button class="btn ghost" id="shareClose">Sluiten</button>
      <button class="btn primary" id="shareCopy">Kopieer link</button>

async function shareProposal(){
  const snap=snapshotState();
  const title=(S.fields.bedrijf||'Voorstel').trim()||'Voorstel';
  flash('Deellink maken\u2026');
  try{

      body:JSON.stringify({title,docType:S.docType,payload:JSON.stringify(snap),shareToken:existing||undefined})});

    if(!res.ok) throw new Error(out.error||'mislukt');
    const token=out.shareToken;

    lsPut(id,{name:title,docType:S.docType,updatedAt:new Date().toISOString(),payload:JSON.stringify(snap),shareToken:token});
    CUR=id;

  }catch(e){
    flash(e && e.message==='already signed' ? 'Al ondertekend \u2014 gebruik Dupliceer' : 'Deellink mislukt');

}

async function checkSignedStatus(token){
  if(!token) return;
  try{
    const res=await fetch(API+'?token='+encodeURIComponent(token));
    if(!res.ok) return;
    const d=await res.json();
    sharesPut(token,{status:d.status,signedAt:d.signedAt});
    if(d.status==='signed' && d.signature){
      S.sig=d.signature.fields||{};
      S.signature=d.signature.signatureImage||null;
      renderPreview();
      flash('Ondertekend door '+(d.signature.signerName||'prospect')+' \u2713', true);
    }
  }catch(e){}
}

document.getElementById('shareBtn').addEventListener('click',shareProposal);

/* ---------- omzetcalculator ---------- */
function rateParts(r){
  const shown=(r.key==='applepay'||r.key==='googlepay')?r.price:composePrice(r.price);
  if(!shown || /aanvraag|all-?incl/i.test(shown)) return null;
  let fixed=null,pct=null;
  const fm=shown.match(/€\s*(\d+(?:[.,]\d+)?)/);
  if(fm) fixed=parseFloat(fm[1].replace(',','.'));
  const pm=shown.match(/(\d+(?:[.,]\d+)?)\s*%/);
  if(pm) pct=parseFloat(pm[1].replace(',','.'));
  if((fixed==null||isNaN(fixed))&&(pct==null||isNaN(pct))) return null;
  return {fixed:fixed||0,pct:pct||0,shown,ic:/ic\+\+/i.test(shown)};
}
function parseNumInput(v){
  if(!v) return null;
  const n=parseFloat(String(v).replace(/[€\s.]/g,'').replace(',','.').replace(/[^\d.]/g,''));
  return isNaN(n)?null:n;
}
function fmtEur(n){ return '€ '+n.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function openCalc(){
  const rows=S.rows.map((r,i)=>({r,i,parts:r.on?rateParts(r):null})).filter(x=>x.parts);
  const modal=document.createElement('div');
  modal.id='calcModal';
  let h=`<div class="box"><h4>Omzetcalculator</h4>
    <div class="lead">Schat de maandelijkse omzet uit de tarieven in dit voorstel. Alleen betaalmethoden met een ingevuld tarief staan in de lijst. Vul per methode het aantal transacties per maand in, plus één gemiddelde orderwaarde. Deze berekening komt niet in het voorstel of de PDF terecht.</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><label style="font:600 12px 'Inter';color:#5A6B76">Gemiddelde orderwaarde (€)</label><input class="aov" id="calcAov" placeholder="bijv. 85,00"></div>
    <table><thead><tr><th>Betaalmethode</th><th>Tarief</th><th class="r">Transacties / mnd</th><th class="r">Omzet / mnd</th></tr></thead><tbody>`;
  for(const x of rows){
    h+=`<tr><td>${esc(x.r.name)}${x.parts.ic?' <span title="IC++: alleen de opslag is meegerekend" style="color:#8A97A0">*</span>':''}</td><td class="rate">${esc(x.parts.shown)}</td><td class="r" style="width:130px"><input data-calctx="${x.i}" inputmode="numeric" placeholder="0"></td><td class="r rev" data-calcrev="${x.i}">—</td></tr>`;
  }
  h+=`<tr class="total"><td colspan="3">Totaal geschatte omzet per maand</td><td class="r" id="calcTotal">—</td></tr></tbody></table>
    <div class="note">Berekening per transactie: vast tarief + percentage × gemiddelde orderwaarde. * Bij IC++-tarieven is alleen de opslag (markup) meegerekend; interchange- en scheme fees zijn doorbelasting. Indicatie, geen garantie.</div>
    <div class="acts"><button class="btn ghost" id="calcClose">Sluiten</button></div></div>`;
  modal.innerHTML=h;
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);
  const recalc=()=>{
    const aov=parseNumInput(document.getElementById('calcAov').value)||0;
    let total=0, any=false;
    for(const x of rows){
      const inp=modal.querySelector(`[data-calctx="${x.i}"]`);
      const tx=parseNumInput(inp.value)||0;
      const rev=tx*(x.parts.fixed + x.parts.pct/100*aov);
      if(tx>0) any=true;
      total+=rev;
      modal.querySelector(`[data-calcrev="${x.i}"]`).textContent=tx>0?fmtEur(rev):'—';
    }
    document.getElementById('calcTotal').textContent=any?fmtEur(total):'—';
  };
  modal.querySelectorAll('input').forEach(i=>i.addEventListener('input',recalc));
  document.getElementById('calcClose').addEventListener('click',()=>modal.remove());
  recalc();
}
document.getElementById('calcBtn').addEventListener('click',openCalc);
document.getElementById('libBtn').addEventListener('click',()=>{ window.top.location.href='/voorstellen'; });

/* ---------- prospect: ondertekenen ---------- */
function renderSignPanel(signed, signerName){
  const sb=document.getElementById('sidebar');
  sb.className='signpanel';
  if(signed){
    sb.innerHTML=`<div class="signdone">Ondertekend \u2713<br><span style="font-weight:500">door ${esc(signerName||'')}</span></div>
      <div class="intro" style="margin-top:12px">U kunt dit voorstel bewaren via Download PDF.</div>`;
    return;
  }
  const defs=sigFieldDefs(S.docType==='partner').filter(f=>!f.sub && !f.image);
  sb.innerHTML=`<div class="intro">Neem het voorstel door. Vul hieronder uw gegevens in, zet uw handtekening en verstuur. Uw gegevens verschijnen direct op de laatste pagina.</div>
    <h3>Uw gegevens</h3>
    ${defs.map(f=>`<div class="fld"><label>${f.label.replace(':','')}</label><input data-sigin="${f.key}" value="${esc((S.sig||{})[f.key]||'')}"></div>`).join('')}
    <h3>Handtekening</h3>
    <canvas id="sigpad" width="560" height="220"></canvas>
    <div class="row"><button class="btn ghost" id="sigClear">Wissen</button>
    <button class="btn primary" id="sigSubmit">Onderteken en verstuur</button></div>
    <div class="msg" id="sigMsg"></div>`;

  sb.querySelectorAll('input[data-sigin]').forEach(el=>{
    el.addEventListener('input',()=>{ S.sig=S.sig||{}; S.sig[el.dataset.sigin]=el.value; renderPreview(); });
  });

  const cv=sb.querySelector('#sigpad'), ctx=cv.getContext('2d');
  ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1A1517';
  let drawing=false, dirty=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [ (e.clientX-r.left)*(cv.width/r.width), (e.clientY-r.top)*(cv.height/r.height) ]; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; dirty=true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  cv.addEventListener('pointerup',()=>{ drawing=false; S.signature=cv.toDataURL('image/png'); renderPreview(); });
  sb.querySelector('#sigClear').addEventListener('click',()=>{ ctx.clearRect(0,0,cv.width,cv.height); dirty=false; S.signature=null; renderPreview(); });

  const msg=sb.querySelector('#sigMsg');
  sb.querySelector('#sigSubmit').addEventListener('click',async()=>{
    const f=S.sig||{};
    const missing=[];
    if(!(f.bedrijfsnaam||'').trim()) missing.push('bedrijfsnaam');
    if(!(f.contactnaam||'').trim()) missing.push('voor- en achternaam');
    if(!(f.email||'').trim()) missing.push('e-mailadres');
    if(!dirty) missing.push('handtekening');
    if(missing.length){ msg.className='msg'; msg.textContent='Vul nog in: '+missing.join(', '); return; }
    const btn=sb.querySelector('#sigSubmit'); btn.disabled=true;
    msg.className='msg'; msg.textContent='Versturen\u2026';
    try{
      const res=await fetch(API+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:SIGN_TOKEN, fields:f, signatureImage:cv.toDataURL('image/png'), signerName:f.contactnaam})});
      const out=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(out.error||'mislukt');
      renderSignPanel(true, f.contactnaam);
    }catch(e){
      btn.disabled=false;
      msg.className='msg';
      msg.textContent = e && e.message==='already signed' ? 'Dit voorstel is al ondertekend.' : 'Versturen mislukt \u2014 probeer opnieuw.';
    }
  });
}

async function bootSign(){
  document.body.classList.add('signmode');
  const sb=document.getElementById('sidebar');
  sb.className='signpanel';
  sb.innerHTML='<div class="intro">Voorstel laden\u2026</div>';
  try{
    const res=await fetch(API+'?token='+encodeURIComponent(SIGN_TOKEN));
    if(!res.ok) throw new Error('nf');
    const d=await res.json();
    restoreState(JSON.parse(d.payload));
    S.sig=S.sig||{};
    const signed = d.status==='signed' && d.signature;
    if(signed){ S.sig=d.signature.fields||{}; S.signature=d.signature.signatureImage||null; }
    renderPreview();
    renderSignPanel(!!signed, signed?d.signature.signerName:'');
  }catch(e){
    console.error('bootSign', e);
    sb.innerHTML='<div class="intro">Dit voorstel is niet (meer) beschikbaar. Vraag de afzender om een nieuwe link.</div>';
  }
}

if(SIGN_TOKEN){
  bootSign();
} else {
  renderAll();
  initStore();
}
